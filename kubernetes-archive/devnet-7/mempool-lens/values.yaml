# Ansible managed. Don't change this file manually. Template info: /vendor/collections/ansible_collections/ethpandaops/general/roles/generate_kubernetes_config/templates/mempool-lens.yaml.j2

mempool-lens:
  fullnameOverride: mempool-lens
  replicas: 1

  image:
    repository: bbusa/mempool-lens
    tag: latest
    pullPolicy: Always
  # Upstream geth WS endpoint; needs the txtracker (and ideally
  # peerstats/admin) namespaces enabled on the WS API. Geth serves WS on the
  # rpc- ingress when ws.port == http.port.
  rpcUrl: "wss://<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.combined}>@rpc-prysm-geth-1.srv.glamsterdam-devnet-7.ethpandaops.io"

  # Browsers only talk to the lens; it proxies the geth WebSocket via /ws.
  proxy: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ingress:
    enabled: true
    className: ingress-nginx-public
    annotations:
      nginx.ingress.kubernetes.io/configuration-snippet: |
        sub_filter '</head>' '<script src="https://pandamenu.ethpandaops.io/panda-menu-1.0.1.js" integrity="sha384-icGX6g6CzB0tqlhDc6Su4c6IPVbcbUvfM3xjbbFYsYBwuZR79WkmOxDhGEPfmyn2" crossorigin="anonymous"></script></head>';
        sub_filter_types text/html;
        sub_filter_once off;
    hosts:
      - host: mempool-lens.glamsterdam-devnet-7.ethpandaops.io
        paths:
          - path: /
            pathType: Prefix
