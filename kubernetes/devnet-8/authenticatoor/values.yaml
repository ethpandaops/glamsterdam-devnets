# Ansible managed. Don't change this file manually. Template info: /vendor/collections/ansible_collections/ethpandaops/general/roles/generate_kubernetes_config/templates/authenticatoor.yaml.j2

authenticatoor:
  fullnameOverride: authenticatoor

  image:
    repository: registry-1.docker.io/ethpandaops/service-authenticatoor
    tag: main-latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  issuer: "https://auth.glamsterdam-devnet-8.ethpandaops.io"
  # Logins must be allowed to return to the alias hosts too. Setting this
  # replaces the chart default of "*.<issuer parent zone>", so list that as well.
  allowedReturnHosts:
    - "*.glamsterdam-devnet-8.ethpandaops.io"
    - "*.plataberget.ethpandaops.io"

  authMode: [authentik]
  providers:
    - name: authentik
      type: oidc
      oidc:
        issuerURL: "https://authentik.analytics.production.platform.ethpandaops.io/application/o/authenticatoor/"
        callbackURL: "https://auth.glamsterdam-devnet-8.ethpandaops.io/authentik/callback"
        clientId: "authenticatoor"
        clientSecretFile: "/etc/authenticatoor/secrets/oidc-client-secret"
        # Non-browser clients (panda's devnet relay) present a token of this
        # IdP application at /authentik/token and get the same grants. Off
        # without grants: tokens would carry no services claim (full access).
        bearer:
          issuerURL: "https://authentik.analytics.production.platform.ethpandaops.io/application/o/devnet-authenticatoor/"
          audiences: ["devnet-authenticatoor"]
        # A group "team:<name>" of the IdP becomes the team <name>.
        teamRules:
          - claim: groups
            prefix: "team:"

  providerSecrets:
    files:
      oidc-client-secret: "<path:/secrets/services/services.enc.yaml#authenticatoor | jsonPath {.oidc_client_secret}>"

  grants:
    - members:
      - authentik/team:ethpandaops
      - authentik/groups:ethpandaops:Core
      name: staff
      services:
      - all:all
    - members:
      - authentik/groups:panda-access
      name: core-devs
      services:
      - faucet:drop_100eth

  persistence:
    enabled: true
    size: "32Mi"

  ingress:
    enabled: true
    className: traefik-devnets
    annotations:
      ethpandaops.io/exposure: "public"
    hosts:
      - host: auth.glamsterdam-devnet-8.ethpandaops.io
        paths:
          - path: /
            pathType: Prefix
      - host: auth.plataberget.ethpandaops.io
        paths:
          - path: /
            pathType: Prefix
