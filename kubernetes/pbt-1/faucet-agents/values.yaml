powfaucet:
  fullnameOverride: powfaucet-agents

  image:
    repository: ghcr.io/qu0b/powfaucet
    tag: v2.5.0-agent.5
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 500Mi
    limits:
      cpu: 400m
      memory: 1Gi

  ingress:
    enabled: true

    className: ingress-nginx-public
    # Lock the faucet behind basic auth that only the panda proxy holds, so it is
    # reachable solely via the proxy (which authenticates the caller first).
    basicAuth: "<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.username}>:{PLAIN}<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.password}>"

    hosts:
      - host: faucet-agents.glamsterdam-pbt-1.ethpandaops.io
        paths:
          - path: /
            pathType: Prefix
  httpProxyCount: 2

  faucetTitle: "glamsterdam-pbt-1 Agent Faucet"
  faucetPrivkey: "<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.faucet_agents_private_key}>"
  faucetRpcUrl: "https://<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.combined}>@rpc-lighthouse-geth-1.srv.glamsterdam-pbt-1.ethpandaops.io"
  faucetRpcEndpoints:
    - url: "https://<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.combined}>@rpc-lighthouse-geth-1.srv.glamsterdam-pbt-1.ethpandaops.io"
      name: "lighthouse-geth-1"
      priority: 10
