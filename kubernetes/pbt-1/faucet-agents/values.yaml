      name: "lighthouse-geth-3"
      priority: 5
  faucetExplorerLink: "https://dora.glamsterdam-pbt-1.ethpandaops.io/tx/{txid}"

  faucetCaptchaEnabled: false
  faucetCaptchaSitekey: "<path:/secrets/services/services.enc.yaml#hcaptcha | jsonPath {.site_key}>"
  faucetCaptchaSecret: "<path:/secrets/services/services.enc.yaml#hcaptcha | jsonPath {.secret_key}>"

  # Per-IP checks only make sense when the faucet sees real client IPs. The
  # agents faucet sits behind the panda proxy (one shared IP), so it disables
  # ipinfo and scopes concurrency + recurring limits per target address.
  faucetIpinfoEnabled: false
  faucetConcurrencyByAddrOnly: true
  faucetRecurringLimitsByAddrOnly: true

  faucetRecurringLimitsAmountWei: 5000000000000000000000 # 5000 ETH
  faucetMaxDropWei: 500000000000000000000 # 500 ETH
  faucetPowEnabled: true
  faucetPowRewardPerHash: 1000000000000000000 # 1 ETH
  faucetPowDifficulty: 8

  extraEnv:
    # Intercontinental IPv4 connections need longer than Node.js default 250ms.
    - name: NODE_OPTIONS
      value: "--network-family-autoselection-attempt-timeout=2000"
    - name: FAUCET_ETH_REST_WALLET_KEY
      value: "<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.faucet_agents_rest_private_key}>"
