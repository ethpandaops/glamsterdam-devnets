      name: "lighthouse-nethermind-1"
      priority: 5
    - url: "https://<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.combined}>@rpc-lighthouse-geth-1.srv.glamsterdam-pbt-1.ethpandaops.io"
      name: "lighthouse-geth-1"
      priority: 5
    - url: "https://<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.combined}>@rpc-lighthouse-erigon-1.srv.glamsterdam-pbt-1.ethpandaops.io"
