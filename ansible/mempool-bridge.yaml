# Replay real mainnet transactions into a mainnet shadowfork (one way): mempool-bridge reads
# mainnet's pool and re-sends every tx to our ELs. Run once the ELs are up:
#   ansible-playbook -i inventories/<sf>/inventory.ini mempool-bridge.yaml
# Only txs whose sender nonce matches the shadowfork state land, so the yield falls as the
# snapshot anchor ages. `-e mempool_bridge_state=absent` removes it.
#
# mempool_bridge_mode (one mode for both sides):
#   rpc (default): polls txpool_content on mempool_bridge_source_rpc (a mainnet node with the
#       txpool API, e.g. ethpandaops' mainnet prysm-nethermind-001, URL with its basic auth) and
#       eth_sendRawTransaction to our ELs' RPC.
#   p2p: devp2p from mempool_bridge_source_enodes to shadowfork_el_static_enodes. Public mainnet
#       nodes answer "too many peers" (27 of 34 dials, 2026-10-07) and the bridge's node key is
#       random per process, so a source must admit it some other way (e.g. --maxpeers headroom).
- hosts: bootnode
  become: true
  vars:
    mempool_bridge_state: started
    mempool_bridge_mode: rpc
    mempool_bridge_image: docker.io/ethpandaops/mempool-bridge:0.2.0
    mempool_bridge_dir: /data/mempool-bridge
    # One RPC per EL client; every EL gossips the txs on through the fleet.
    mempool_bridge_target_hosts: "{{ groups['ethereum_node'] | map('extract', hostvars) | selectattr('validator_start', 'defined') | groupby('ethereum_node_el') | map('last') | map('first') | map(attribute='inventory_hostname') | list }}"
    mempool_bridge_target_rpc: >-
      {{ mempool_bridge_target_hosts
         | map('regex_replace', '^(.*)$', 'https://' ~ secret_nginx_shared_basic_auth.name ~ ':' ~ secret_nginx_shared_basic_auth.password ~ '@' ~ ethereum_node_rpc_prefix ~ '\1.' ~ network_server_subdomain)
         | list }}
  tasks:
    - name: Require a source and a target
      ansible.builtin.assert:
        that: >-
          (mempool_bridge_mode == 'rpc' and mempool_bridge_source_rpc | default([]) | length > 0)
          or (mempool_bridge_mode == 'p2p' and mempool_bridge_source_enodes | default([]) | length > 0
              and shadowfork_el_static_enodes | length > 0)
        fail_msg: set mempool_bridge_source_rpc (rpc) or mempool_bridge_source_enodes + shadowfork_el_static_enodes (p2p)
      when: mempool_bridge_state != 'absent'

    - name: Create config dir
      ansible.builtin.file:
        path: "{{ mempool_bridge_dir }}"
        state: directory
        mode: "0700"
      when: mempool_bridge_state != 'absent'

    # Holds basic-auth URLs in rpc mode: root-only.
    - name: Write config
      ansible.builtin.copy:
        dest: "{{ mempool_bridge_dir }}/config.yaml"
        mode: "0600"
        content: "{{ config | to_nice_yaml }}"
      no_log: true
      vars:
        config:
          logging: info
          metricsAddr: 127.0.0.1:9095
          mode: "{{ mempool_bridge_mode }}"
          source: "{{ {'retryInterval': '30s', 'pollingInterval': '10s', 'rpcEndpoints': mempool_bridge_source_rpc}
                      if mempool_bridge_mode == 'rpc' else
                      {'retryInterval': '30s', 'nodeRecords': mempool_bridge_source_enodes} }}"
          target: "{{ {'retryInterval': '30s', 'sendConcurrency': 10, 'rpcEndpoints': mempool_bridge_target_rpc}
                      if mempool_bridge_mode == 'rpc' else
                      {'retryInterval': '30s', 'nodeRecords': shadowfork_el_static_enodes} }}"
      when: mempool_bridge_state != 'absent'

    # Host network: in p2p mode the SF-P2P firewall (scripts/shadowfork-ethrex-firewall.sh) drops
    # every container's traffic on port 30303 in DOCKER-USER; host processes go through OUTPUT.
    # Nothing from our side reaches mainnet: the bridge only sends to the target.
    - name: Run mempool-bridge
      community.docker.docker_container:
        name: mempool-bridge
        image: "{{ mempool_bridge_image }}"
        state: "{{ mempool_bridge_state }}"
        network_mode: host
        restart_policy: unless-stopped
        command: ["--config", "/config/config.yaml"]
        volumes:
          - "{{ mempool_bridge_dir }}:/config:ro"
