domain: ethpandaops.io
network_subdomain: "{{ ethereum_network_name }}.{{ domain }}"
network_server_subdomain: srv.{{ network_subdomain }}
server_fqdn: "{{ inventory_hostname }}.{{ network_server_subdomain }}"
network_iteration: "{{ ethereum_network_name.split('-')[1:] | join('-') }}"

ethereum_network_id: >-
  {{ (lookup('file', eth_testnet_config_local_dir_src + '/genesis.json') | from_json).config.chainId }}
ethereum_network_deposit_contract: >-
  {{ lookup('file', eth_testnet_config_local_dir_src + '/deposit_contract.txt') }}
ethereum_network_deposit_contract_block: >-
  {{ lookup('file', eth_testnet_config_local_dir_src + '/deposit_contract_block.txt') }}

ethereum_node_rpc_prefix: rpc- # prefix for rpc URLs
ethereum_node_beacon_prefix: bn- # prefix for beacon URLs
ethereum_node_rcp_hostname: "{{ ethereum_node_rpc_prefix }}{{ server_fqdn }}"
ethereum_node_beacon_hostname: "{{ ethereum_node_beacon_prefix }}{{ server_fqdn }}"

primary_bootnode: bootnode-1

### Checkpoint sync specific for Ansible & Kubernetes
checkpoint_sync_node: "{{ primary_bootnode }}"
# Shadowfork: every CL starts from the generated genesis.ssz (there is no older
# finalized state to sync from), so checkpoint sync stays off.
ethereum_node_cl_checkpoint_sync_enabled: false

checkpoint_sync_url: https://checkpoint-sync.{{ ethereum_network_name }}.{{ domain }}
# checkpoint_sync_url: https://{{ secret_nginx_shared_basic_auth.name }}:{{ secret_nginx_shared_basic_auth.password }}@{{ ethereum_node_beacon_prefix }}{{ checkpoint_sync_node }}.{{ ethereum_network_name }}.{{ domain }}
checkpoint_sync_url_kube: https://<path:/secrets/services/services.enc.yaml#ethereum | jsonPath {.testnets.glamsterdam-devnets.node_ingress.combined}>@{{
  ethereum_node_beacon_prefix }}{{ checkpoint_sync_node }}.{{ ethereum_network_name }}.{{ domain }}

