---
# Override the shared all-group default at the worker-group level. The umbrella
# role forwards this to client roles; local Besu image IDs cannot be pulled.
ethereum_node_images_always_pull: false

ethereum_cl_bootnodes: >-
  {{
    (
      [primary_bootnode]
      | map('extract', hostvars, ['bootnodoor_fact_enr'])
      | select('defined')
      | reject('equalto', '')
      | list
    )
    +
    (
      groups['ethereum_node'] | unique | list
      | map('extract', hostvars, ['ethereum_node_fact_discovery_cl_enr'])
      | select('defined')
      | reject('equalto', '')
      | list
    )
  }}

ethereum_el_bootnodes: >-
  {{
    groups['ethereum_node']
    | reject('equalto', inventory_hostname)
    | map('extract', pbt_peer_identities, 'enr')
    | unique
    | sort
    | list
  }}


ethereum_node_xatu_sentry_enabled: true

# Peer identities are prepared outside DB snapshots; discovery must read those
# same keys rather than the cloned keys inside restored databases.
ethereum_node_fact_discovery_el_key_cmd:
  geth: cat /data/pbt-1/node-identity/nodekey
  besu: cat /data/pbt-1/node-identity/nodekey
  erigon: cat /data/pbt-1/node-identity/nodekey
  nethermind: xxd -p -c32 /data/pbt-1/node-identity/node.key.plain

# role: ethpandaops.general.brakebear
brakebear_download_speed: "{{ ethereum_node_cl_supernode_enabled | ternary('1000Mbps', '100Mbps') }}"
brakebear_upload_speed: "{{ ethereum_node_cl_supernode_enabled | ternary('1000Mbps', '50Mbps') }}"
brakebear_config: |
  log_level: "info"
  docker_containers:
    - name: "execution"
      download_rate: {{ brakebear_download_speed }}
      upload_rate: {{ brakebear_upload_speed }}
      exclusions:
        private-networks: true
        docker-networks:
          names: ["*"]
    - name: "beacon"
      download_rate: {{ brakebear_download_speed }}
      upload_rate: {{ brakebear_upload_speed }}
      exclusions:
        private-networks: true
        docker-networks:
          names: ["*"]


# role: ethpandaops.general.prometheus
prometheus_remote_push_url: https://victoriametrics-public.analytics.production.platform.ethpandaops.io/insert/1/prometheus
prometheus_remote_write_username: "{{ ethereum_network_name }}"  # gateway tags ingress_user=<username>; the sops one is devnet-8's
prometheus_remote_write_password: "{{ secret_prometheus_remote_write.password }}"
prometheus_config: |
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool | default(false) }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    # Container CPU/memory against the EL limits (cAdvisor, playbook.yaml).
    - job_name: "cadvisor"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["cadvisor:8080"]
          labels:
            instance: "{{ inventory_hostname }}"
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: "container_(cpu_usage_seconds_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|memory_rss|memory_cache|memory_usage_bytes|memory_max_usage_bytes|memory_failcnt|spec_memory_limit_bytes|spec_cpu_quota|oom_events_total|fs_reads_bytes_total|fs_writes_bytes_total|network_receive_bytes_total|network_transmit_bytes_total)"
          action: keep
        - source_labels: [name]
          regex: ".+"
          action: keep
        - regex: "id|image|container_label_.*"
          action: labeldrop
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ inventory_hostname }}"
    - job_name: "consensus_node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["{{ vars[ethereum_node_cl + '_container_name'] }}:{{ ethereum_node_cl_ports_metrics }}"]
          labels:
            instance: "{{ inventory_hostname }}"
