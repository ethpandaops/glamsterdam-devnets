---
# role: ethpandaops.general.bootstrap
besu_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_el: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/besu?format=txt') | select | list)
     + besu_extra_github_users }}

# role: ethpandaops.general.snapshot_fetcher
snapshot_fetcher_out_dir: /data/pbt-1/besu
besu_datadir: /data/pbt-1/besu

# role: ethpandaops.general.ethereum_node
ethereum_node_el: besu
# role: ethpandaops.general.besu
besu_container_name: execution
besu_container_image: "{{ default_ethereum_client_images.besu }}"
besu_profiling_enabled: true
besu_profiling_host_dir: /data/besu-profiling
besu_profiling_minimum_free_bytes: 42949672960
besu_profiling_checkpoint_keep: 24
besu_container_entrypoint: /opt/besu-profiling-entrypoint.sh
besu_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  BESU_OPTS: >-
    -Xmx8g -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10
    -XX:+HeapDumpOnOutOfMemoryError
  BESU_PROFILING_DIR: /profiling
pbt_besu_base_volumes:
  - "{{ besu_datadir }}:/data"
  - "/data/pbt-1/node-identity:/node-identity:ro"
  - "{{ besu_auth_jwt_path }}:/execution-auth.jwt:ro"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"
  - "{{ besu_profiling_host_dir }}:/profiling"
  - "{{ besu_profiling_host_dir }}/entrypoint.sh:/opt/besu-profiling-entrypoint.sh:ro"
besu_container_volumes: "{{ pbt_besu_base_volumes + pbt_migration_input_bind_mounts }}"
pbt_besu_base_args:
  - --node-private-key-file=/node-identity/nodekey
  - --genesis-file=/network-config/{{ pbt_genesis_file }}
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  - --discovery-dns-url=
  - --discovery-mode=V5
  - --rpc-http-api=ADMIN,ETH,MINER,NET,TXPOOL,WEB3,DEBUG
  # Restored jochemnet snapshot: nothing to sync, FULL just follows the CL from the
  # snapshot head (fusaka shadowforks). The snapshot may come from another besu
  # version, so skip the datadir version check.
  - --sync-mode=FULL
  - --version-compatibility-protection=false
  # Serve SNAP to peers when requested. All nine baseline workers are restored.
  - --snapsync-server-enabled=true
  - --data-storage-format=BONSAI
  - --bonsai-limit-trie-logs-enabled=false
  - --color-enabled=false
  - --cache-last-blocks=2048
  - --rpc-http-max-active-connections=1000
  # devnet8 block gas limit is 200M; raise the RPC cap so eth_call/estimateGas can simulate full-block txs
  - --rpc-gas-cap=200000000
  # ~20k pending txs: layered pool sorts 10000 by default; the byte-capped layers (75 MB) hold the rest
  - --tx-pool-max-prioritized=20000
# PBT migration restart (pbt_migration_enabled): waits for sync and finality of N,
# then loads the snapshot in the background while MPT execution continues.
pbt_besu_migration_args:
  - --Xpbt-snapshot-file={{ pbt_migration_input_container_dir }}/pbt-snapshot.bin
  - --Xpbt-preimages-file={{ pbt_migration_input_container_dir }}/framed.bin
  - --Xpbt-snapshot-anchor-block-hash={{ pbt_anchor_hash }}
  - --Xpbt-migration-threads=4
  - --Xpbt-migration-blocks-per-roll=128
  - --Xpbt-migration-sort-buffer=64
besu_container_command_extra_args: "{{ pbt_besu_base_args + (pbt_besu_migration_args if pbt_migration_enabled | bool else []) }}"
# Loaded from the verified build archive on both workers, not a registry tag.
besu_container_pull: false

prometheus_config: |
  global:
    scrape_interval: 12s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool | default(false) }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    # Container CPU/memory against the EL limits (cAdvisor, playbook.yaml).
    - job_name: "cadvisor"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["cadvisor:8080"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: "container_(cpu_usage_seconds_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|memory_rss|memory_cache|memory_usage_bytes|memory_max_usage_bytes|memory_failcnt|spec_memory_limit_bytes|spec_cpu_quota|oom_events_total|fs_reads_bytes_total|fs_writes_bytes_total|network_receive_bytes_total|network_transmit_bytes_total)"
          action: keep
        - source_labels: [name]
          regex: ".+"
          action: keep
        - regex: "id|image|container_label_.*"
          action: labeldrop
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "consensus_node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["{{ vars[ethereum_node_cl + '_container_name'] }}:{{ ethereum_node_cl_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "execution"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["execution:{{ ethereum_node_el_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
