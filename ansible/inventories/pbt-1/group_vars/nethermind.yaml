---
# role: ethpandaops.general.bootstrap
nethermind_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_el: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/nethermind?format=txt') | select | list)
     + nethermind_extra_github_users }}

# role: ethpandaops.general.snapshot_fetcher (snapshot layout: mainnet/, FlatDb)
snapshot_fetcher_out_dir: /data/pbt-1/nethermind
nethermind_datadir: /data/pbt-1/nethermind

# role: ethpandaops.general.ethereum_node
ethereum_node_el: nethermind
# role: ethpandaops.general.nethermind
nethermind_container_name: execution
nethermind_container_image: "{{ default_ethereum_client_images.nethermind }}"
nethermind_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
nethermind_container_entrypoint:
  - /nethermind/nethermind
pbt_nethermind_base_volumes:
  - "{{ nethermind_datadir }}:/data"
  - "/data/pbt-1/node-identity:/node-identity:ro"
  - "{{ nethermind_auth_jwt_path }}:/execution-auth.jwt:ro"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"
nethermind_container_volumes: "{{ pbt_nethermind_base_volumes + pbt_migration_input_bind_mounts }}"
pbt_nethermind_base_args:
  - --KeyStore.EnodeKeyFile=/node-identity/node.key.plain
  # Restored jochemnet snapshot: the built-in mainnet config with our genesis.json as
  # the chainspec (same genesis hash and inherited amsterdamTime) and the db the snapshot
  # ships. The preset turns on fast/snap sync; pin both off so nethermind only ever
  # resumes from the restored db. All nine baseline workers are restored.
  - --config=mainnet
  - --Init.ChainSpecPath=/network-config/{{ pbt_genesis_file }}
  - --Init.BaseDbPath=/data/mainnet
  - --FlatDb.Enabled=true
  - --FlatDb.Layout=Flat
  # The replay uses TTD 0; stored synthetic headers can have TD below mainnet TTD.
  # Keep them post-merge during startup re-execution as well as Engine API import.
  - --Merge.TerminalTotalDifficulty=0
  - --Sync.FastSync=false
  - --Sync.SnapSync=false
  - --JsonRpc.EnabledModules=Eth,Subscribe,TxPool,Web3,Personal,Proof,Net,Parity,Health,Rpc,Admin,Debug
  - --Discovery.Bootnodes={{ ethereum_el_bootnodes | join(',') }}
  - --Discovery.DiscoveryVersion=V5
  # chain id 1 otherwise adds the mainnet DNS tree and default discv5 bootnodes
  - --Network.EnableEnrDiscovery=false
  - --Discovery.UseDefaultDiscv5Bootnodes=false
  - --Pruning.Mode=None
  # ~20k pending txs (default 2048; the mainnet preset does not set it). Startup requires
  # Size * 40 KB <= half the MemoryHint left after fixed allowances (MemoryHintMan.cs); the
  # preset's 1 GB hint rejects 20000, so raise it.
  - --TxPool.Size=20000
  - --Init.MemoryHint=2500000000
  - --log=INFO
  - --Seq.MinLevel=Info
  - --Seq.ServerUrl={{ nethermind_seq_server }}
  - --Seq.ApiKey={{ nethermind_seq_api_key }}
  - --Metrics.PushGatewayUrl={{ nethermind_push_gateway }}
# PBT migration restart (pbt_migration_enabled): keeps the prepared FlatDB layout;
# the validator rejects FlatDB history mode, so it is pinned off here.
pbt_nethermind_migration_args:
  - --Pbt.Enabled=true
  - --FlatDb.HistoryEnabled=false
  - --Pbt.MigrationSnapshotPath={{ pbt_migration_input_container_dir }}/pbt-snapshot.bin
  - --Pbt.MigrationPreimagesPath={{ pbt_migration_input_container_dir }}/framed.bin
  - --Pbt.MigrationAnchor={{ pbt_anchor_block }}
nethermind_container_command_extra_args: "{{ pbt_nethermind_base_args + (pbt_nethermind_migration_args if pbt_migration_enabled | bool else []) }}"
nethermind_container_pull: true

prometheus_config: |
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool | default(false) }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "consensus_node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["{{ vars[ethereum_node_cl + '_container_name'] }}:{{ ethereum_node_cl_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "execution"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["execution:{{ ethereum_node_el_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
