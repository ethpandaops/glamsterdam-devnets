---
# role: ethpandaops.general.bootstrap
geth_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_el: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/geth?format=txt') | select | list)
     + geth_extra_github_users }}

# role: ethpandaops.general.snapshot_fetcher: a geth archive is geth's instance dir, unprefixed
# (snapshots.ethpandaops.io and benchmarkoor snapshot export alike), so it goes under <datadir>/geth.
# Extracted flat, geth opens chaindata/ but misses triedb/merkle.journal and rewinds its head.
snapshot_fetcher_out_dir: /data/pbt-1/geth
geth_datadir: /data/pbt-1

# role: ethpandaops.general.ethereum_node
ethereum_node_el: geth

# role: ethpandaops.general.geth
geth_container_name: execution
geth_container_image: "{{ default_ethereum_client_images.geth }}"
geth_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
pbt_geth_base_volumes:
  - "{{ geth_datadir }}:/data"
  - "/data/pbt-1/node-identity:/node-identity:ro"
  - "{{ geth_auth_jwt_path }}:/execution-auth.jwt:ro"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"
geth_container_volumes: "{{ pbt_geth_base_volumes + pbt_migration_input_bind_mounts }}"
pbt_geth_base_args:
  - --nodekey=/node-identity/nodekey
  - --override.genesis=/network-config/{{ pbt_genesis_file }}
  - --http.api=eth,net,web3,admin,txpool,debug
  - --http.vhosts=*
  - --networkid={{ ethereum_network_id }}
  - --syncmode=full
  # Keep the prepared canonical history and BALs for import and self-migration.
  - --history.chain=all
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  - --discovery.dns=
  - --discovery.v4=false
  - --discovery.v5=true
  # devnet8 block gas limit is 200M; raise the RPC cap so eth_estimateGas/eth_call can simulate full-block txs
  - --rpc.gascap=200000000
  # ~20k pending txs (default 4096+1024 slots of 32 KiB, 1024 queued)
  - --txpool.globalslots=20000
  - --txpool.globalqueue=5000
# PBT migration restart (pbt_migration_enabled): import workers load the N snapshot;
# self-migration (Geth-3) omits it and seeds from its own flat state at P >= N.
pbt_geth_migration_args: >-
  {{ (['--pbt.import.snapshot=' ~ pbt_migration_input_container_dir ~ '/pbt-snapshot.bin']
      if pbt_migration_role == 'import' else [])
     + ['--pbt.import.preimages=' ~ pbt_migration_input_container_dir ~ '/framed.bin',
        '--pbt.import.anchor=' ~ pbt_anchor_hash,
        '--pbt.import.workers=4'] }}
geth_container_command_extra_args: "{{ pbt_geth_base_args + (pbt_geth_migration_args if pbt_migration_enabled | bool else []) }}"
geth_container_pull: true

prometheus_config: |
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool | default(false) }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "consensus_node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["{{ vars[ethereum_node_cl + '_container_name'] }}:{{ ethereum_node_cl_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "execution"
      metrics_path: "/debug/metrics/prometheus"
      static_configs:
        - targets: ["execution:{{ ethereum_node_el_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
