---
# role: ethpandaops.general.bootstrap
erigon_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_el: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/erigon?format=txt') | select | list)
     + erigon_extra_github_users }}

# role: ethpandaops.general.snapshot_fetcher
snapshot_fetcher_out_dir: /data/erigon

# role: ethpandaops.general.ethereum_node
ethereum_node_el: erigon

# role: ethpandaops.general.erigon
erigon_container_name: execution
erigon_container_image: "{{ default_ethereum_client_images.erigon }}"
erigon_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  SAVE_HEAP_PROFILE: "true"
erigon_container_command_extra_args:
  - --http.api=eth,erigon,engine,web3,net,txpool,admin
  - --http.vhosts=*
  - --ws
  - --networkid={{ ethereum_network_id }}
  - --db.size.limit=1TB  # sepolia datadir is ~985 GB
  # Shadowfork hook: makes the erigon role re-run `init` over the restored chaindata
  # and stops erigon from swapping our genesis.json config for its built-in sepolia one.
  - --keep.stored.chain.config=true
  # With sepolia's network id erigon starts its embedded CL (caplin): it synced real
  # sepolia past the snapshot and answered our CL's engine calls with "caplin is enabled".
  - --externalcl
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  # Engine-API catch-up (>96 blocks behind) needs peers that have our chain; discovery
  # mostly finds real sepolia nodes. Our snapshot ELs (geth/nethermind/besu/reth) as static peers.
  - --staticpeers=enode://054ad55768c933516fc9f515fd9cd714ab9aee1084d825102168b799466b9e1ae29e15afbd372be32435328d3cd60f699920d77025dda39495c945165cb38c6e@159.203.90.89:30303,enode://09a4af36a41fe649a0121bc8b778c173b1802011e7d97463c4f0fa46f2bde4a2277436257ad0bb15c84c3a700238801f2a3ce05e7b9ba7ac587916a4630cf62b@159.89.125.145:30303,enode://1081073f5f57fa0a8f18fcf5a2291b8954e6b354e204b900cdc822bb4fbc9feffffc0617f544672c7a2c3aa612a02fdf64c708e800387c72c868625bf44157aa@24.144.100.150:30303,enode://1fa55f126e49b4c108179e807d62c64e63341e691c56681a54fd0e765a8b4bfeeeeb6cf7d0daaa724e47a94dbc43f1add1fdbd5219fc3c9d74f748ed8b51050a@64.227.176.225:30303,enode://1fcc9b40e7b8e1d355d5d571ff2b52f2af24c0b79e9573de1e2bf5832dfb1ab697b7284520682fafaef3a6084b8dea02fe5541ed10513e945a107a46bff28867@104.248.136.226:30303,enode://305d01e6055101ea007a251ff7b8c8a80a912c04597ccbd411dbdb80f8ab4f40e75683ffa24bca4f7cef2686913afca4ad5683a957a37fbb72ffee5fb29ea4c4@134.122.81.44:30303,enode://306d96f76a59500c7a102aa68b47dfb3e17894752854603c8a6a7aad45b51daefd98a3e024fee3af5367bf1a471472a6fe5b62053e5fceddda8d0d9cb5057836@161.35.93.110:30303,enode://34c482bc6b56a9efbfc919cdb2f94a6ac3689da771e492a5654a7f6106dcd1f1636a73e531b8b953a4e1c9446b2975e84fb0227b5b50f2e76f39efd7810f6bcd@104.131.170.109:30303,enode://446bcef2a6779f3ab2a8c9a3d3bfdbe95b5fa0eda5787b65caf18fafbf4d7e4b60172a6c31ad34db6498903bdde515065275d198f526935c84452ff109d6e186@159.65.9.42:30303,enode://450c3f6b8f3fc2e58cdc7be212a855b4355289ec4934702c32123d9f6a7873cb9511757f301c728c012b41d47ceac8690d6db956028d4d15ed15bc738381f749@68.183.94.231:30303,enode://50d39fc27484be40069f71aa07feec74be6b240163510666bd549378ae1a14c5714f71b32d417492378d6d3a9756cd73f7658dec359953248436f60e6011d5cd@24.199.86.238:30303,enode://53d0d6a15aae8831ea665543291ae4750af616f72e6ddc3ab7b1377e79e33017304e276ae272721b9332c83fb2a960b95653c6892d55ca48a6ea6ceae3605045@146.190.26.20:30303,enode://59122e97a3b40e389b6b69240590c1a4f02443e1ed6a6cbb99b67a6ab6a31b34c194670c694b31b8ffadd