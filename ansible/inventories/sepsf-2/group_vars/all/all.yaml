# role: ethpandaops.general.ethereum_genesis
ethereum_genesis_generator_container_image: "{{ default_tooling_images.ethereum_genesis_generator }}"
ethereum_genesis_generator_version: "{{ ethereum_genesis_generator_container_image.split(':')[-1] }}"
ethereum_genesis_network_seed: glamsterdam-sepsf-2
# Sepolia's chain id switches the genesis generator into shadowfork mode: it loads
# eth-clients/sepolia genesis.json, keeps every fork that is already active at
# shadowfork_height (osaka, bpo1, bpo2) at its real time, overwrites sepolia's own
# amsterdamTime with ours and adds no allocs. Chain and network id stay 11155111.
ethereum_genesis_chain_id: "11155111"
ethereum_genesis_fork_version_suffix: "{{ 999999 | random(start=100000, seed=ethereum_genesis_network_seed) }}"
ethereum_genesis_generator_output_dir: ../network-configs/{{ network_iteration }}
# Genesis 2026-10-02 13:30:00 UTC: ~40 min after the last snapshot finished
# restoring (12:48:55 UTC; shadowfork.yaml does not depend on the genesis time).
# Gloas at epoch 40 = 17:46:00 UTC, before sepolia's own Gloas (2026-10-06
# 13:53:36 UTC, epoch 353024). Exits/consolidations/partial withdrawals cannot be
# queued across the fork (SHARD_COMMITTEE_PERIOD 256 > 40); EIP-8282 builder deposits can.
ethereum_genesis_timestamp: 1790947800
ethereum_genesis_timedelay: 0
# Sepolia block the shadowfork builds on: 2026-10-01 06:23:00 UTC, hash
# 0xd95349c2354b05d477a38da94a9997c27b97b07d8eba2e2998d0edfb538524f8, 60M gas.
# The EL snapshots (geth/besu/nethermind/reth/erigon) are pinned to the same
# height: snapshots.ethpandaops.io deletes old heights, so never use "latest".
# sepsf-2 (2026-10-02): 11820000 is still the latest sepolia snapshot height for all five ELs
# (none newer published), so sepsf-2 forks from the same block as sepsf-1.
shadowfork_height: 11820000
gloas_fork_epoch: 40
ethereum_genesis_mnemonic: "{{ secret_genesis_mnemonic }}"
ethereum_genesis_generator_config_files:
  cl/config.yaml: "{{ lookup('ansible.builtin.url', 'https://raw.githubusercontent.com/ethpandaops/ethereum-genesis-generator/v{{ethereum_genesis_generator_version}}/config-example/cl/config.yaml',
    split_lines=false) }}" # noqa yaml[line-length]
  cl/mnemonics.yaml: "{{ lookup('ansible.builtin.url', 'https://raw.githubusercontent.com/ethpandaops/ethereum-genesis-generator/v{{ethereum_genesis_generator_version}}/config-example/cl/mnemonics.yaml',
    split_lines=false) }}" # noqa yaml[line-length]
  el/genesis-config.yaml: "{{ lookup('ansible.builtin.url', 'https://raw.githubusercontent.com/ethpandaops/ethereum-genesis-generator/v{{ethereum_genesis_generator_version}}/config-example/el/genesis-config.yaml',
    split_lines=false) }}" # noqa yaml[line-length]
  # Network identity and fork schedule only - every spec parameter not listed
  # here follows the egg defaults, which match sepolia's Gloas config.yaml.
  # Shadowfork specifics:
  # - SHADOW_FORK_FILE: the head the EL state and the CL genesis build on.
  # - DEPOSIT_CONTRACT_ADDRESS must be sepolia's or the generator refuses.
  # - GAS_LIMIT_SCHEDULE: 200M at the Gloas epoch, exactly like sepolia.
  # - WITHDRAWAL_TYPE=0x01 + VALIDATOR_BALANCE=10000 ETH (every fusaka shadowfork
  #   did this): shadowfork mode adds no premines, so the 9968 ETH excess per
  #   validator is swept to WITHDRAWAL_ADDRESS (mnemonic index 0,
  #   0x454b0EA7d8aD3C56D0CF2e44Ed97b2Feab4D7AF2) and funds the tooling from there.
  #   None of the tooling accounts holds sepolia ETH at shadowfork_height.
  # Not set because shadowfork mode ignores them: EL premines, GENESIS_GASLIMIT,
  # DEPLOY_EIP8282_CONTRACTS (both EIP-8282 builder contracts are already on
  # sepolia at shadowfork_height: deposit 0x0000bff46984e3725691fa540a8c7589300d8282,
  # exit 0x000064d678505ad48f8ccb093bc65613800e8282).
  values.env: |-
    export CHAIN_ID="{{ ethereum_genesis_chain_id }}"
    export EL_AND_CL_MNEMONIC="{{ ethereum_genesis_mnemonic }}"
    export NUMBER_OF_VALIDATORS=36000
    export GENESIS_FORK_VERSION="0x10{{ ethereum_genesis_fork_version_suffix }}"
    export ALTAIR_FORK_VERSION="0x20{{ ethereum_genesis_fork_version_suffix }}"
    export BELLATRIX_FORK_VERSION="0x30{{ ethereum_genesis_fork_version_suffix }}"
    export CAPELLA_FORK_VERSION="0x40{{ ethereum_genesis_fork_version_suffix }}"
    export DENEB_FORK_VERSION="0x50{{ ethereum_genesis_fork_version_suffix }}"
    export ELECTRA_FORK_VERSION="0x60{{ ethereum_genesis_fork_version_suffix }}"
    export FULU_FORK_VERSION="0x70{{ ethereum_genesis_fork_version_suffix }}"
    export GLOAS_FORK_VERSION="0x80{{ ethereum_genesis_fork_version_suffix }}"
    export GLOAS_FORK_EPOCH="{{ gloas_fork_epoch }}"
    export GAS_LIMIT_SCHEDULE='[{"epoch": {{ gloas_fork_epoch }}, "gas_limit": 200000000}]'
    export GENESIS_TIMESTAMP={{ ethereum_genesis_timestamp }}
    export GENESIS_DELAY={{ ethereum_genesis_timedelay }}
    export WITHDRAWAL_TYPE=0x01
    export VALIDATOR_BALANCE=10000000000000
    export DEPOSIT_CONTRACT_ADDRESS=0x7f02C3E3c98b133055B8B348B2Ac625669Ed295D
    export SHADOW_FORK_FILE="https://snapshots.ethpandaops.io/{{ snapshot_fetcher_network }}/geth/{{ shadowfork_height }}/_snapshot_eth_getBlockByNumber.json"

# role: ethpandaops.general.snapshot_fetcher (variable names reused by
# ansible/shadowfork.yaml, which downloads with parallel ranged GETs instead).
# snapshot_fetcher_out_dir is set per EL in its group_vars file.
snapshot_fetcher_network: sepolia
snapshot_fetcher_client: "{{ ethereum_node_el }}"
snapshot_fetcher_block: "{{ shadowfork_height }}"

ethereum_genesis_validator_keys_output_dir: "{{ ansible_inventory_sources[0] | dirname }}/files/validator_keys"
ethereum_genesis_validator_bls_change_execution_address: "{{ ethereum_node_cl_validator_fee_recipient }}"
ethereum_genesis_validator_keyranges: >-
  {%- set ns = namespace() -%}
  {%- set ns.ethereum_genesis_validator_keyranges = {} -%}
  {%- for host in groups['all'] -%}
  {%-   if hostvars[host].validator_start is defined and hostvars[host].validator_end is defined -%}
  {%-      set v = {'start':hostvars[host].validator_start, 'end': hostvars[host].validator_end } -%}
  {%-     set _ = ns.ethereum_genesis_validator_keyranges.update({host: v}) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ ns.ethereum_genesis_validator_keyranges }}

# Validator display names for the /meta/api/v1/validator-ranges.json endpoint
# (consumed by dora, assertoor and beacon-metrics-gazer). A host may set
# validator_display_name to be shown instead of its inventory hostname (used for
# experimental-build hosts). Only the displayed segment name changes:
# key generation and syncing still key by hostname through
# ethereum_genesis_validator_keyranges above.
eth_inventory_web_segments_json: >-
  {%- set segs = [] -%}
  {%- for host, kr in (ethereum_genesis_validator_keyranges | default({})).items() -%}
  {%-   set _ = segs.append({'name': hostvars[host].validator_display_name | default(host), 'start': kr.start | int, 'end': (kr.end | int) - 1}) -%}
  {%- endfor -%}
  {{ segs | to_json }}

# role: ethpandaops.general.bootstrap
bootstrap_default_user_authorized_keys_plain:
  - "ssh-rsa 
    # devops-eth2-shared"
  - "ssh-rsa 
    # github-actions-ci"
# Per-client team SSH rosters are fetched at runtime from the coredevs registry
# (see each client group_vars file). https://github.com/ethpandaops/coredevs
coredevs_api_url: https://coredevs.analytics.production.platform.ethpandaops.io

# ethpandaops core team, sourced from the coredevs ethpandaops team. Handles not
# in the coredevs team go in the extra list.
github_all_extra_users:
  - bharath-123
bootstrap_default_user_authorized_keys_github_all: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/ethpandaops?format=txt') | select | list)
     + github_all_extra_users }}

bootstrap_default_user_authorized_keys_github: >
  {{
    (bootstrap_default_user_authorized_keys_github_all | default([])) +
    (bootstrap_default_user_authorized_keys_github_team_el | default([])) +
    (bootstrap_default_user_authorized_keys_github_team_cl | default([]))
  }}

node_exporter_container_image: "{{ default_tooling_images.node_exporter }}"
prometheus_container_image: "{{ default_tooling_images.prometheus }}"
vector_container_image: "{{ default_tooling_images.vector }}"
json_rpc_snooper_container_image: "{{ default_tooling_images.json_rpc_snooper }}"

# role: ethpandaops.general.ethereum_node
ethereum_node_images_always_pull: true
ethereum_node_metrics_exporter_enabled: true
ethereum_node_xatu_sentry_enabled: true
ethereum_node_cl_validator_enabled: "{{ validator_start is defined and validator_end is defined }}"
ethereum_node_cl_validator_fee_recipient: "0xf97e180c050e5Ab072211Ad2C213Eb5AEE4DF134"
ethereum_node_cl_ports_p2p_tcp: 9000
ethereum_node_cl_ports_p2p_udp: 9000
ethereum_node_cl_ports_http_beacon: 5052
ethereum_node_cl_ports_metrics: 5054
ethereum_node_el_ports_p2p_tcp: 30303
ethereum_node_el_ports_p2p_udp: 30303
ethereum_node_el_ports_http_rpc: 8545
ethereum_node_el_ports_ws_rpc: 8546
ethereum_node_el_ports_engine: 8551
ethereum_node_el_ports_metrics: 6060
ethereum_node_ipv6_enabled: true
ethereum_node_el_public_ipv6: "{{ host_ipv6_prefix | ansible.utils.ipaddr(service_ipv6_offsets.execution) | ansible.utils.ipaddr('address') if (docker_network_enable_ipv6
  | bool) else '' }}"
ethereum_node_cl_public_ipv6: "{{ host_ipv6_prefix | ansible.utils.ipaddr(service_ipv6_offsets.beacon) | ansible.utils.ipaddr('address') if (docker_network_enable_ipv6
  | bool) else '' }}"
ethereum_node_validator_public_ipv6: "{{ host_ipv6_prefix | ansible.utils.ipaddr(service_ipv6_offsets.validator) | ansible.utils.ipaddr('address') if (docker_network_enable_ipv6
  | bool) else '' }}"
ethereum_node_snooper_rpc_public_ipv6: "{{ host_ipv6_prefix | ansible.utils.ipaddr(service_ipv6_offsets.snooper_rpc) | ansible.utils.ipaddr('address') if (docker_network_enable_ipv6
  | bool) else '' }}"
ethereum_node_snooper_engine_public_ipv6: "{{ host_ipv6_prefix | ansible.utils.ipaddr(service_ipv6_offsets.snooper_engine) | ansible.utils.ipaddr('address') if (docker_network_enable_ipv6
  | bool) else '' }}"
ethereum_node_skip_cleanup: true
# Watchtower: daily image check staggered per host across a 3-hour window
# ending at 18:00 CET/CEST (seeded by network+hostname) so fleet-wide image
# rolls restart nodes one by one instead of all at once (devnet-9 lesson).
# Off for the shadowfork: its window (13:00-16:00 UTC) would roll clients around
# genesis and the fork; images are pinned for the run, rolls are on request.
ethereum_node_docker_watchtower_enabled: false
ethereum_node_docker_watchtower_containers_list:
  - execution
  - beacon
  - validator
  - xatu-sentry
docker_watchtower_container_additional_args:
  - "--schedule=0 {{ 60 | random(seed=ethereum_network_name ~ inventory_hostname ~ 'min') }} {{ 15 + (3 | random(seed=ethereum_network_name ~ inventory_hostname ~ 'hour')) }} * * *"
  - --stop-timeout=300s
  - --include-restarting
docker_watchtower_container_env:
  TZ: Europe/Paris
ethereum_node_json_rpc_snooper_engine_enabled: true
ethereum_node_json_rpc_snooper_engine_name: snooper-engine
ethereum_node_json_rpc_snooper_engine_port: 8561
ethereum_node_json_rpc_snooper_engine_public_port: 8961
ethereum_node_json_rpc_snooper_engine_container_env:
  SNOOPER_API_PORT: "{{ ethereum_node_json_rpc_snooper_engine_public_port | quote }}"
  SNOOPER_API_AUTH: "{{ secret_nginx_shared_basic_auth.name }}:{{ secret_nginx_shared_basic_auth.password }}"
  SNOOPER_XATU_ENABLED: "true"
  SNOOPER_XATU_NAME: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
  SNOOPER_XATU_NETWORK_NAME: "{{ ethereum_network_name }}"
  SNOOPER_XATU_NETWORK_ID: "{{ ethereum_network_id }}"
  SNOOPER_XATU_OUTPUTS: "xatu:{{ xatu_sentry_config_server_address }}"
  SNOOPER_XATU_TLS: "true"
  SNOOPER_XATU_HEADERS: "authorization=Basic {{ (xatu_sentry_config_server_auth_user + ':' + xatu_sentry_config_server_auth_password) | b64encode }}"
  SNOOPER_JWT_SECRET: /execution-auth.jwt
json_rpc_snooper_container_volumes:
  - /data/execution-auth.secret:/execution-auth.jwt:ro

# role: ethpandaops.general.generate_kubernetes_config
# Nickname for this devnet, used for faucet titles and dora/forkmon labels.
gen_kubernetes_config_network_display_name: glamsterdam-sepsf-2
gen_kubernetes_config_dora_execution_snooper_port: 8961
gen_kubernetes_config_dora_frontend_rainbowkit_id: 15fe4ab4d5c0bcb6f0dc7c398301ff0e
gen_kubernetes_config_dora_execution_endpoints_url: https://raw.githubusercontent.com/ethpandaops/{{ devnet_name }}-devnets/refs/heads/master/kubernetes/{{
  network_iteration }}/dora/endpoints-el.yaml
gen_kubernetes_config_dora_consensus_endpoints_url: https://raw.githubusercontent.com/ethpandaops/{{ devnet_name }}-devnets/refs/heads/master/kubernetes/{{
  network_iteration }}/dora/endpoints-cl.yaml
gen_kubernetes_config_dora_api_secret: "{{ secret_dora_api_key }}"
gen_kubernetes_config_dora_xatu_enabled: true
# Don't let tooling call debug/trace endpoints: disable dora execution indexer
# trace fetching (debug_traceBlockBy*) and the tracoor chart entirely.
gen_kubernetes_config_dora_execution_indexer_traces: false
gen_kubernetes_config_disabled_services:
  - tracoor
# No startup assertoor tests: the deploy-eip8282-contracts playbook devnet-8 ran
# is not needed, both builder contracts already exist on sepolia.
gen_kubernetes_config_assertoor_tests: []

# role: ethpandaops.general.xatu_sentry
xatu_sentry_container_image: "{{ default_tooling_images.xatu_sentry }}"
xatu_sentry_config_name: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
# Per-devnet xatu pipeline (mca-xatu-devnets in platform): the ingest host is
# derived from the network name so new devnets need no wiring here.
xatu_sentry_config_server_address: "{{ ethereum_network_name }}-ingest.xatu.ethpandaops.io:443"
xatu_sentry_config_server_auth_user: "{{ secret_xatu_sentry.user }}"
xatu_sentry_config_server_auth_password: "{{ secret_xatu_sentry.password }}"
xatu_sentry_config_network_name_override: "{{ ethereum_network_name }}"

# Full config override: adds the Gloas SSE topics, which the sentry's default
# subscription set deliberately excludes.
xatu_sentry_config: |
  logging: "info"
  metricsAddr: ":9090"
  name: "{{ xatu_sentry_config_name }}"
  ntpServer: time.google.com
  ethereum:
    beaconNodeAddress: {{ xatu_sentry_config_beacon_uri }}
    overrideNetworkName: {{ xatu_sentry_config_network_name_override }}
    beaconSubscriptions:
      - attestation
      - single_attestation
      - block
      - block_gossip
      - chain_reorg
      - finalized_checkpoint
      - head
      - head_v2
      - voluntary_exit
      - contribution_and_proof
      - blob_sidecar
      - data_column_sidecar
      - execution_payload
      - execution_payload_gossip
      - execution_payload_available
      - execution_payload_bid
      - payload_attestation_message
      - proposer_preferences
  outputs:
  - name: grpc
    type: xatu
    config:
      address: {{ xatu_sentry_config_server_address }}
      tls: {{ xatu_sentry_config_server_tls_enabled }}
      maxQueueSize: 100000
      workers: 5
      headers:
        authorization: "Basic {{ (xatu_sentry_config_server_auth_user + ":" + xatu_sentry_config_server_auth_password) | b64encode }}"

# role: ethpandaops.general.ethereum_metrics_exporter
ethereum_metrics_exporter_container_image: "{{ default_tooling_images.ethereum_metrics_exporter }}"
ethereum_metrics_exporter_container_user: root
ethereum_metrics_exporter_container_volumes:
  - "{{ ethereum_metrics_exporter_dir_config }}:/config:ro"
  - /var/run/docker.sock:/var/run/docker.sock:ro
  - /data:/data:ro
ethereum_metrics_exporter_config: |
  consensus:
    enabled: true
    url: "{{ ethereum_metrics_exporter_cl_endpoint }}"
    name: "consensus-client"
  execution:
    enabled: true
    url: "{{ ethereum_metrics_exporter_el_endpoint }}"
    name: "execution-client"
    modules:
      - "eth"
      - "net"
      - "web3"
      - "txpool"
  docker:
    enabled: true
    endpoint: "unix:///var/run/docker.sock"
    interval: "10s"
    containers:
      - name: "execution"
        type: "execution"
        filesystem:
          enabled: true
        volumes:
          - name: "*"
            monitor: true
          - path: "/execution-auth.jwt"
            monitor: false
          - path: "/network-config"
            monitor: false
      - name: "beacon"
        type: "consensus"
        filesystem:
          enabled: true
        volumes:
          - name: "*"
            monitor: true
          - path: "/execution-auth.jwt"
            monitor: false
          - path: "/network-config"
            monitor: false

# role: eth_testnet_config
eth_testnet_config_dir: /data/ethereum-network-config/metadata
eth_testnet_config_local_dir_enabled: true
eth_testnet_config_local_dir_src: "{{ ethereum_genesis_generator_output_dir }}/metadata/"

# role: gen_basic_auth_nginx
gen_basic_auth_nginx_name: "{{ secret_nginx_shared_basic_auth.name }}"
gen_basic_auth_nginx_password: "{{ secret_nginx_shared_basic_auth.password }}"
docker_nginx_proxy_container_image: "{{ default_tooling_images.nginx_proxy }}"
docker_nginx_proxy_docker_gen_container_image: "{{ default_tooling_images.nginx_proxy_gen }}"
docker_nginx_proxy_acme_companion_container_image: "{{ default_tooling_images.nginx_proxy_acme }}"

# role: ethpandaops.general.docker_nginx_proxy
docker_nginx_proxy_public_ipv6: "{{ host_ipv6_prefix | ansible.utils.ipaddr(service_ipv6_offsets.nginx_proxy) | ansible.utils.ipaddr('address') if (docker_network_enable_ipv6
  | bool) else '' }}"
docker_nginx_proxy_container_name: nginx-proxy
docker_nginx_proxy_default_email: certs@{{ domain }}
docker_nginx_proxy_docker_gen_container_name: nginx-proxy-gen
docker_nginx_proxy_docker_gen_container_env:
  RESOLVERS: 1.1.1.1
  ENABLE_IPV6: "true"
docker_nginx_proxy_acme_companion_enabled: false
docker_nginx_proxy_acme_companion_container_name: nginx-proxy-acme
docker_nginx_proxy_acme_companion_container_env:
  DEFAULT_EMAIL: "{{ docker_nginx_proxy_default_email }}"
  NGINX_PROXY_CONTAINER: "{{ docker_nginx_proxy_container_name }}"
  NGINX_DOCKER_GEN_CONTAINER: "{{ docker_nginx_proxy_docker_gen_container_name }}"
  ACME_CA_URI: https://acme.zerossl.com/v2/DV90
  ACME_EAB_KID: "{{ secret_zerossl.ACME_EAB_KID }}"
  ACME_EAB_HMAC_KEY: "{{ secret_zerossl.ACME_EAB_HMAC_KEY }}"
docker_nginx_proxy_container_networks: >-
  {{ [{'name': 'shared'} | combine({'ipv6_address': docker_nginx_proxy_public_ipv6} if (docker_nginx_proxy_public_ipv6 | default('') | length > 0) else {})] }}
docker_nginx_proxy_docker_gen_container_networks: []
docker_nginx_proxy_acme_companion_container_networks: "{{ docker_networks_shared }}"
docker_nginx_proxy_acme_monitor_container_networks: "{{ docker_networks_shared }}"
docker_nginx_proxy_acme_monitor_enabled: false
docker_nginx_proxy_datadir: /opt/nginx-proxy
docker_nginx_proxy_container_volumes:
  - "{{ docker_nginx_proxy_datadir }}/conf:/etc/nginx/conf.d"
  - "{{ docker_nginx_proxy_datadir }}/vhost:/etc/nginx/vhost.d"
  - "{{ docker_nginx_proxy_datadir }}/certs:/etc/nginx/certs:ro"
  - html:/usr/share/nginx/html
  - "{{ docker_nginx_proxy_datadir }}/htpasswd:/etc/nginx/htpasswd:ro"
docker_nginx_proxy_cert_loader_container_image: "{{ default_tooling_images.nginx_proxy_cert_loader }}"
docker_nginx_proxy_cert_linker_container_image: "{{ default_tooling_images.nginx_proxy_cert_linker }}"
docker_nginx_proxy_cert_loader_container_networks: []
docker_nginx_proxy_cert_linker_container_networks: []
docker_nginx_proxy_wildcard_cert: "{{ network_server_subdomain }}"
docker_nginx_proxy_wildcard_cert_url: http://cert.{{ network_server_subdomain }}/{{ network_server_subdomain }}-latest.tar.enc
docker_nginx_proxy_wildcard_cert_psk: "{{ secret_cert_encryption_psk }}"

# OTLP egress to the prod analytics gateway (Vector ships container logs here).
# Ingress identity (auth username + ingress_user tag) is the current devnet name
# rather than secret_loki.username: the sops username drifts stale between devnet
# iterations, while the gateway only validates the (constant) password — so using
# the network name keeps log attribution correct no matter what sops holds.
otlp_endpoint: https://otlp.analytics.production.platform.ethpandaops.io
otlp_deployment_env: production

# role: ethpandaops.general.vector
vector_config: |
  # Docker container logs (clean per-container metadata straight from the Docker API)
  [sources.in]
    type = "docker_logs"
    exclude_containers = [
      "{{ vector_container_name }}",
      "ethereum-metrics-exporter",
      "nginx-proxy",
      "node_exporter",
      "prometheus",
      "snooper-",
    ]

  # Shape docker_logs events into an OTLP resourceLogs envelope with full metadata.
  [transforms.otel_shape]
    type = "remap"
    inputs = ["in"]
    source = '''
      ts_ns = to_string(to_unix_timestamp(now(), unit: "nanoseconds"))
      if is_timestamp(.timestamp) {
        ts_ns = to_string(to_unix_timestamp!(.timestamp, unit: "nanoseconds"))
      }
      msg  = string(.message)        ?? ""
      ctr  = string(.container_name) ?? "unknown"
      img  = string(.image)          ?? ""
      strm = string(.stream)         ?? "stdout"

      # Extract the source log level: JSON-structured lines (.level / .severity)
      # first, then logfmt (level=xxx), then a level token near the start of a
      # plain-text line. Client formats vary (lighthouse truncates to 4 chars:
      # DEBG/ERRO/CRIT), so the text matcher allows a union of forms. SeverityText
      # keeps the source's exact text; only SeverityNumber is normalised to the
      # OTel scale (https://opentelemetry.io/docs/specs/otel/logs/data-model/#field-severitynumber).
      # Unrecognised lines are left unset rather than guessed.
      sevtext = ""
      if starts_with(msg, "{") {
        j = parse_json(msg) ?? {}
        if is_string(j.level) {
          sevtext = string!(j.level)
        } else if is_string(j.severity) {
          sevtext = string!(j.severity)
        }
      }
      if sevtext == "" {
        lm = parse_regex(msg, r'(?i)\b(?:level|lvl|severity)="?(?P<l>[a-z]+)') ?? {}
        if is_string(lm.l) {
          sevtext = string!(lm.l)
        } else {
          hm = parse_regex(truncate(msg, 48), r'(?i)\b(?P<l>TRACE|DEBUG|DEBG|DBUG|NOTICE|INFO|WARNING|WARN|ERROR|ERRO|CRITICAL|CRIT|FATAL|PANIC)\b') ?? {}
          if is_string(hm.l) {
            sevtext = string!(hm.l)
          }
        }
      }
      lvl = upcase(sevtext)
      sevnum = 0
      if lvl == "TRACE" {
        sevnum = 1
      } else if lvl == "DEBUG" || lvl == "DEBG" || lvl == "DBUG" {
        sevnum = 5
      } else if lvl == "INFO" || lvl == "INFOR" || lvl == "NOTICE" {
        sevnum = 9
      } else if lvl == "WARN" || lvl == "WARNING" {
        sevnum = 13
      } else if lvl == "ERROR" || lvl == "ERRO" {
        sevnum = 17
      } else if lvl == "CRIT" || lvl == "CRITICAL" {
        sevnum = 18
      } else if lvl == "FATAL" || lvl == "PANIC" {
        sevnum = 21
      }

      attrs = [
        {"key": "service.name",           "value": {"stringValue": ctr}},
        {"key": "container.name",         "value": {"stringValue": ctr}},
        {"key": "container.image.name",   "value": {"stringValue": img}},
        {"key": "deployment.environment", "value": {"stringValue": "{{ otlp_deployment_env }}"}},
        {"key": "forwarder",              "value": {"stringValue": "vector"}},
        {"key": "ingress_user",           "value": {"stringValue": "{{ ethereum_network_name }}"}},
        {"key": "network",                "value": {"stringValue": "{{ ethereum_network_name }}"}},
        {"key": "testnet",                "value": {"stringValue": "{{ ethereum_network_name }}"}},
        {"key": "instance",               "value": {"stringValue": "{{ inventory_hostname }}"}},
        {"key": "host.name",              "value": {"stringValue": "{{ inventory_hostname }}"}}
      ]
  {%- if ethereum_node_cl is defined +%}
      attrs = push(attrs, {"key": "ethereum_cl", "value": {"stringValue": "{{ ethereum_node_cl }}"}})
  {%- endif +%}
  {%- if ethereum_node_el is defined +%}
      attrs = push(attrs, {"key": "ethereum_el", "value": {"stringValue": "{{ ethereum_node_el }}"}})
  {%- endif +%}
      . = {
        "resource_log": {
          "resource": {"attributes": attrs},
          "scopeLogs": [{
            "scope": {"name": "{{ ethereum_network_name }}-vector"},
            "logRecords": [{
              "timeUnixNano":   ts_ns,
              "severityNumber": sevnum,
              "severityText":   sevtext,
              "body": {"stringValue": msg},
              "attributes": [{"key": "stream", "value": {"stringValue": strm}}]
            }]
          }]
        }
      }
    '''

  # Batch many shaped log events into one OTLP envelope (reduce works on logs).
  [transforms.batch_envelope]
    type = "reduce"
    inputs = ["otel_shape"]
    expire_after_ms = 30000
    end_every_period_ms = 5000
    max_events = 500
    merge_strategies.resource_log = "array"

  [transforms.finalize_envelope]
    type = "remap"
    inputs = ["batch_envelope"]
    source = '''
      . = {"resourceLogs": .resource_log}
    '''

  [sinks.otlp_logs]
    type = "opentelemetry"
    inputs = ["finalize_envelope"]
    [sinks.otlp_logs.protocol]
      type = "http"
      uri = "{{ otlp_endpoint }}/v1/logs"
      method = "post"
      encoding.codec = "otlp"
      auth.strategy = "basic"
      auth.user = "{{ ethereum_network_name }}"
      auth.password = "{{ secret_loki.password }}"
      # One event here is already a full OTLP envelope (built by the reduce above).
      # max_events MUST be 1 — OTLP/HTTP allows one envelope per request.
      batch.max_events = 1
      batch.timeout_secs = 5

