---
# TEMP: Debug RPC to re-execute rejected block 11821006 (HeaderGasUsedMismatch). Remove after.
nethermind_container_command_extra_args:
  # Restored sepolia snapshot: the built-in sepolia config with our genesis.json as
  # the chainspec (same genesis hash, amsterdamTime moved) and the db the snapshot
  # ships. The preset turns on fast/snap sync; pin both off so nethermind only ever
  # resumes from the restored db (ethrex is the only snap syncer on this network).
  - --config=sepolia
  - --Init.ChainSpecPath=/network-config/genesis.json
  - --Init.BaseDbPath=nethermind_db/sepolia
  - --Sync.FastSync=false
  - --Sync.SnapSync=false
  - --JsonRpc.EnabledModules=Eth,Subscribe,TxPool,Web3,Personal,Proof,Net,Parity,Health,Rpc,Admin,Debug
  - --Discovery.Bootnodes={{ ethereum_el_bootnodes | join(',') }}
  - --Discovery.DiscoveryVersion=V5
  - --Pruning.Mode=None
  - --log=INFO
  - --Seq.MinLevel=Info
  - --Seq.ServerUrl={{ nethermind_seq_server }}
  - --Seq.ApiKey={{ nethermind_seq_api_key }}
  - --Metrics.PushGatewayUrl={{ nethermind_push_gateway }}

# nethermind master (requested by the nethermind team): carries the EIP-8037 state-gas
# fixes missing from 2.0.0, which rejected the first Amsterdam block 11821006.
nethermind_container_image: registry-1.docker.io/ethpandaops/nethermind:master@sha256:eb8c47f8e01c452a840325e5c7a2b658824227d6703985a20096c68e4879ad52
