---
# role: ethpandaops.general.bootstrap
erigon_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_el: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/erigon?format=txt') | select | list)
     + erigon_extra_github_users }}

# role: ethpandaops.general.snapshot_fetcher
snapshot_fetcher_out_dir: /data/erigon
# Frozen up to 24401000; if one stalls at the first block (retire deadlock), --snap.stop via host_vars.
snapshot_fetcher_filename: snapshot-pruned.tar.zst

# role: ethpandaops.general.ethereum_node
ethereum_node_el: erigon

# role: ethpandaops.general.erigon
erigon_container_name: execution
erigon_container_image: "{{ default_ethereum_client_images.erigon }}"
erigon_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  SAVE_HEAP_PROFILE: "true"
# Per-host additions go in erigon_host_extra_args (host_vars); --staticpeers only once the
# enodes are known (an empty one is invalid, and the old --nodiscover=false fallback made
# erigon v3.7.1 exit: "Flags --discovery.v4, --nodiscover can't be used at the same time").
erigon_container_command_extra_args: >-
  {{ erigon_shadowfork_args
     + ((['--staticpeers=' ~ (shadowfork_el_static_enodes | join(','))]) if shadowfork_el_static_enodes | length > 0 else [])
     + (erigon_host_extra_args | default([])) }}
erigon_shadowfork_args:
  - --http.api=eth,erigon,engine,web3,net,txpool,admin
  - --http.vhosts=*
  - --ws
  - --networkid={{ ethereum_network_id }}
  - --db.size.limit=2TB
  # Shadowfork hook: makes the erigon role re-run `init` over the restored chaindata
  # and stops erigon from swapping our genesis.json config for its built-in mainnet one.
  - --keep.stored.chain.config=true
  # Otherwise caplin starts and follows the real chain (sepsf-1).
  - --externalcl
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  # Engine-API catch-up (>96 blocks behind) needs peers that have our chain; discovery
  # mostly finds real mainnet nodes. Our snapshot ELs are added
  # as --staticpeers above.
  - --discovery.v4=false
  - --discovery.v5=true
  - --log.console.verbosity=debug
  # devnet8 block gas limit is 200M; raise the RPC cap so eth_call/estimateGas can simulate full-block txs
  - --rpc.gascap=200000000
  # pprof HTTP server (fetch profiles via port-forward / container IP)
  - --pprof
  - --pprof.addr=0.0.0.0
  - --pprof.port=6060
erigon_init_custom_network: true
erigon_init_custom_network_genesis_file: "{{ eth_testnet_config_dir }}/genesis.json"

prometheus_config: |
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool | default(false) }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "consensus_node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["{{ vars[ethereum_node_cl + '_container_name'] }}:{{ ethereum_node_cl_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "execution"
      metrics_path: "/debug/metrics/prometheus"
      static_configs:
        - targets: ["execution:{{ ethereum_node_el_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
