---
# role: ethpandaops.general.bootstrap
ethrex_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_el: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/ethrex?format=txt') | select | list)
     + ethrex_extra_github_users }}

ethereum_node_fact_discovery_el_key_cmd:
  ethrex: xxd -p -c32 {{ ethrex_datadir | default('/data/ethrex') }}/chain-{{ ethereum_network_id | trim }}/node.key

# role: ethpandaops.general.ethereum_node
ethereum_node_el: ethrex
# role: ethpandaops.general.ethrex
ethrex_container_name: execution
ethrex_container_image: "{{ default_ethereum_client_images.ethrex }}"
ethrex_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  RUST_LOG: info
ethrex_container_volumes:
  - "{{ ethrex_datadir }}:/data"
  - "{{ ethrex_auth_jwt_path }}:/execution-auth.jwt:ro"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"
ethrex_container_command_extra_args:
  - --network=/network-config/genesis.json
  # Real sepolia peers stay fork-id compatible until amsterdamTime and answer header/state
  # requests with sepolia's chain (ethrex then snap-syncs the wrong state). Peer only with
  # our snapshot ELs: no discovery, our enodes as bootnodes; p2p is also firewalled to our
  # droplets on the ethrex hosts (DOCKER-USER chain SEPSF1-P2P).
  # Until the static enodes are known, discover via our bootnode ENRs (discv5); once known, those
  # enodes via discv4. ethrex (v29.0.0-rc.1) only seeds its peer table with --bootnodes when a
  # discovery protocol is on, so turning both off leaves it with 0 peers. The p2p firewall on the
  # ethrex hosts (scripts/shadowfork-ethrex-firewall.sh) limits port-30303 peers to our droplets.
  - "--bootnodes={{ (shadowfork_el_static_enodes if shadowfork_el_static_enodes | length > 0 else ethereum_el_bootnodes) | join(',') }}"
  - "--p2p.discv4={{ 'true' if shadowfork_el_static_enodes | length > 0 else 'false' }}"
  - "--p2p.discv5={{ 'false' if shadowfork_el_static_enodes | length > 0 else 'true' }}"
  - --http.api=eth,net,web3,admin
  # No sepolia ethrex snapshot exists: snap-sync the state from the restored
  # geth/nethermind/besu nodes (full sync would replay 11.8M sepolia blocks).
  - --syncmode=snap

prometheus_config: |
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool | default(false) }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "consensus_node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["{{ vars[ethereum_node_cl + '_container_name'] }}:{{ ethereum_node_cl_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "execution"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["execution:{{ ethereum_node_el_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
