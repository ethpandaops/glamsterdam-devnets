# Consensus client groups
#
# Every node runs prysm, so every group is a child of [prysm]. Keeping prysm at
# this depth preserves group_vars precedence against the sibling EL groups.
# DigitalOcean and terraform still use the devnet-9 names; see host-mapping.txt.
[prysm:children]
buildoor_prysm_ethrex
buildoor_prysm_geth
buildoor_prysm_nethermind
prysm_besu
prysm_erigon
prysm_ethrex
prysm_geth
prysm_nethermind
prysm_nimbusel
prysm_reth

# Execution client groups

[besu:children]
prysm_besu

[ethereumjs:children]

[geth:children]
buildoor_prysm_geth
prysm_geth

[nethermind:children]
buildoor_prysm_nethermind
prysm_nethermind

[erigon:children]
prysm_erigon

[reth:children]
prysm_reth

[nimbusel:children]
prysm_nimbusel

[ethrex:children]
buildoor_prysm_ethrex
prysm_ethrex

# Buildoor host aggregator

[buildoor:children]
buildoor_prysm_ethrex
buildoor_prysm_geth
buildoor_prysm_nethermind

# ansible_group_priority MUST live in the inventory (not group_vars/) — it is consulted
# while loading group_vars, so a value placed in group_vars/buildoor.yaml is read too late
# and the buildoor overrides lose to alphabetically-later sibling groups (geth, prysm).
[buildoor:vars]
ansible_group_priority=100

# Global groups

[consensus_node:children]
prysm

[execution_node:children]
besu
erigon
ethrex
geth
nethermind
nimbusel
reth
buildoor

[ethereum_node:children]
consensus_node
execution_node

[dns_server:children]
bootnode

[mev_boost:children]
consensus_node

[arm]
