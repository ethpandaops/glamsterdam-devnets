---
# Debugging the stalled snap sync (header download stuck, 2-5 peers): debug logs
# for this host only. Remove once understood.
ethrex_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  RUST_LOG: info,ethrex_p2p=debug,ethrex=debug
ethrex_container_command_extra_args:
  - --network=/network-config/genesis.json
  # ethrex debugging: typical devnet p2p (bootnode + discovery), no static peer list;
  # the SEPSF1-P2P firewall is also removed on this host.
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  - --http.api=eth,net,web3,admin
  - --syncmode=snap
  - --log.level=debug
