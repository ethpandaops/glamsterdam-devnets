---
# NOTE: precedence over sibling groups (prysm/ethrex) is established via
# `[buildoor:vars] ansible_group_priority=100` in inventory.ini — that variable
# is consulted while loading group_vars, so it cannot be set here.

buildoor_container_image: "{{ default_tooling_images.buildoor }}"
buildoor_container_pull: true
buildoor_container_networks: "{{ docker_networks_shared }}"

buildoor_jwt_path: /data/execution-auth.secret
buildoor_cl_client: http://beacon:{{ ethereum_node_cl_ports_http_beacon }}
buildoor_el_engine_api: http://execution:{{ ethereum_node_el_ports_engine }}
buildoor_el_rpc: http://execution:{{ ethereum_node_el_ports_http_rpc }}

# Avoid conflict with prysm metrics on 127.0.0.1:8080
buildoor_api_port: 8085

# Verify API tokens against the centralized authenticatoor service for this devnet.
buildoor_auth_provider_url: https://auth.{{ network_subdomain }}
buildoor_overview_url: https://buildoor.{{ network_subdomain }}

# Wallet ECDSA private key
buildoor_wallet_privkey: "{{ secret_buildoor_wallet_privkey }}"
# Builder BLS private key
buildoor_builder_mnemonic: "{{ secret_buildoor_builder_mnemonic }}"
buildoor_builder_mnemonic_index: "{{ builder_index }}"

buildoor_container_command_extra_args:
  - --validator-ranges-url=https://config.{{ network_subdomain }}/api/v1/nodes/validator-ranges
buildoor_container_env:
  VIRTUAL_HOST: api-{{ server_fqdn }}
  VIRTUAL_PORT: "{{ buildoor_api_port | string }}"
  LETSENCRYPT_HOST: api-{{ server_fqdn }}
  BUILDOOR_INJECT_HEAD_HTML: <script src="https://pandamenu.ethpandaops.io/panda-menu-1.0.1.js"
    integrity="sha384-icGX6g6CzB0tqlhDc6Su4c6IPVbcbUvfM3xjbbFYsYBwuZR79WkmOxDhGEPfmyn2" crossorigin="anonymous"></script>

# Re-apply the prysm.yaml merge so we don't lose the bootnode args while adding --prepare-all-payloads and --subscribe-all-subnets
prysm_container_command_extra_args: >-
  {{ prysm_container_command_extra_simple_args
     + prysm_container_command_extra_bootnode_args
     + ['--prepare-all-payloads', '--subscribe-all-subnets'] }}
lighthouse_container_command_extra_args: >-
  {{ lighthouse_container_command_extra_simple_args
     + ['--always-prepare-payload', '--subscribe-all-subnets', '--import-all-attestations'] }}
lodestar_container_command_extra_args: >-
  {{ lodestar_container_command_extra_simple_args
     + ['--emitPayloadAttributes', '--subscribeAllSubnets'] }}
teku_container_command_extra_args: >-
  {{ teku_container_command_extra_simple_args
     + ['--Xfork-choice-updated-always-send-payload-attributes=true', '--p2p-subscribe-all-subnets-enabled'] }}
grandine_container_command_extra_args: >-
  {{ grandine_container_command_extra_simple_args
     + ['--features=AlwaysPrepareExecutionPayload', '--subscribe-all-subnets'] }}


ethereum_node_docker_watchtower_containers_list:
  - execution
  - beacon
  - validator
  - xatu-sentry
  - buildoor

# 16 GiB buildoor tier (vs 32 GiB matrix): override group_vars/ethrex.yaml so ethrex fits in RAM.
# - --syncmode=snap   : avoids full-sync batch commit-ahead (the #7127 restart hazard) and large diff-layer backlog
# - --rocksdb.block-cache-size=4294967296 : cap the 12 GiB default RocksDB block cache to 4 GiB
ethrex_container_command_extra_args:
  - --network=/network-config/genesis.json
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  - --p2p.discv4=false
  - --p2p.discv5=true
  - --http.api=eth,net,web3,admin,debug
  - --syncmode=snap
  - --rocksdb.block-cache-size=4294967296
