---
# role: ethpandaops.general.bootstrap
besu_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_el: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/besu?format=txt') | select | list)
     + besu_extra_github_users }}

# role: ethpandaops.general.ethereum_node
ethereum_node_el: besu
# role: ethpandaops.general.besu
besu_container_name: execution
besu_container_image: "{{ default_ethereum_client_images.besu }}"
besu_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  # 2026-09-07: besu OOMs during BackwardSyncContext phase 2 while replaying the ~2k block
  # backlog of 200M-gas blocks. The session dies, restarts, and loses throughput -- import rate
  # fell 4.86 -> 1.6 blocks/min and the gap started GROWING (nimbus-besu-1: remaining 1682 -> 1719
  # over 18 min). This is a distinct OOM from the debug_trace one (BUG-896); no tracing is enabled
  # any more and the spammer has stopped. JVM default is 25% of RAM = ~7.84 GB on these 31.35 GiB
  # hosts; besu was already sitting at 8.7-10.3 GiB RSS. 12g leaves ~12 GiB headroom after the
  # beacon (~2.4 GiB) and sidecars (~1.5 GiB). There is no swap (BUG-832) so do not go higher.
  # buildoor-lodestar-besu-1 keeps its own 5g host_vars override (15.6 GiB host).
  # 2026-09-07 05:55: 12g held for ~1 h (92 -> 2 OOMs/hr) then degraded back to 48/hr as the
  # backward sync progressed. Root cause is BackwardSyncContext.BATCH_SIZE = 200, hardcoded with no
  # CLI override, and halveBatchSize() only fires on short peer responses -- never on memory pressure
  # (BUG-900). Heap is therefore the only lever available to us. 16g leaves >=7.7 GiB free on the
  # tightest host (teku-besu-1: 11.9 GiB avail, 3.1 GiB beacon). Still a delay, not a fix -- the real
  # answer is SNAP sync (plan decision D5b). No swap on these hosts (BUG-832): do not exceed 16g.
  BESU_OPTS: "-Xmx16g -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10"
besu_container_volumes:
  - "{{ besu_datadir }}:/data"
  - "{{ besu_auth_jwt_path }}:/execution-auth.jwt:ro"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"
besu_container_command_extra_args:
  - --genesis-file=/network-config/genesis.json
  - --bootnodes={{ ethereum_el_bootnodes | join(',') }}
  - --discovery-mode=V5
  # DEBUG removed 2026-09-06: dora (executionIndexerTracesEnabled) calls debug_traceBlockByHash,
  # which allocates one TraceFrame per opcode with no cap (besu --rpc-max-trace-steps is only
  # enforced on the *_call paths), OOM-killing every besu node on 200M-gas blocks.
  # TRACE removed too 2026-09-07: erpc routes trace_block/trace_transaction to besu upstreams and
  # those hit the same uncapped path (buildoor-lodestar-besu-1 kept OOMing via
  # TracedJsonRpcProcessor after DEBUG alone was removed). See BUG-896.
  - --rpc-http-api=ADMIN,ETH,MINER,NET,TXPOOL,WEB3
  - --sync-mode=FULL
  - --data-storage-format=BONSAI
  - --bonsai-limit-trie-logs-enabled=false
  - --color-enabled=false
  - --cache-last-blocks=2048
  - --rpc-http-max-active-connections=1000
  # devnet8 block gas limit is 200M; raise the RPC cap so eth_call/estimateGas can simulate full-block txs
  - --rpc-gas-cap=200000000
besu_container_pull: true

prometheus_config: |
  global:
    scrape_interval: 12s
    evaluation_interval: 30s
    scrape_timeout: 10s
    external_labels:
      instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
      ip_address: "{{ ansible_host }}"
      network: "{{ ethereum_network_name }}"
      testnet: "{{ ethereum_network_name }}"
      execution_client: "{{ ethereum_node_el }}"
      consensus_client: "{{ ethereum_node_cl }}"
      supernode: "{{ ethereum_node_cl_supernode_enabled | bool | default(false) }}"
  remote_write:
    - queue_config:
        batch_send_deadline: 5s
        max_backoff: 500ms
        max_samples_per_send: 500
        min_backoff: 50ms
        max_shards: 100
      url: {{ prometheus_remote_push_url }}
      remote_timeout: 10s
      basic_auth:
        username: {{ prometheus_remote_write_username }}
        password: {{ prometheus_remote_write_password }}
  scrape_configs:
    - job_name: "prometheus"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["localhost:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["172.17.0.1:9100"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "exporter"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["ethereum-metrics-exporter:9090"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "consensus_node"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["{{ vars[ethereum_node_cl + '_container_name'] }}:{{ ethereum_node_cl_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
    - job_name: "execution"
      metrics_path: "/metrics"
      static_configs:
        - targets: ["execution:{{ ethereum_node_el_ports_metrics }}"]
          labels:
            instance: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
