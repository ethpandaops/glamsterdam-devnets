---
# Work around Lighthouse startup failures after freezer migration.
# See https://github.com/sigp/lighthouse/issues/10142
lighthouse_container_command_extra_args: >-
  {{ lighthouse_container_command_extra_simple_args
     | reject('equalto', '--enable-fast-confirmation') | list }}

# Keep the existing beacon DB intact while checkpoint syncing a clean DB.
lighthouse_datadir: /data/lighthouse-recovery-20260928

# The previous Besu data dir was nonempty, so Besu skipped its configured SNAP sync.
# Retain it and the earlier backup while starting SNAP sync from an empty data dir.
besu_datadir: /data/besu-recovery-20260928
