---
# This buildoor host has 15.6 GiB RAM (the regular devnet-8 hosts have 31.3 GiB) and runs
# EL + CL + buildoor + snooper + sidecars on it. Besu's JVM default max heap is 25% of RAM,
# i.e. ~3.9 GB here vs ~7.84 GB elsewhere, and it sat pinned at 3.55 GB throwing
# OutOfMemoryError on 200M-gas blocks even after DEBUG/TRACE were removed from the RPC APIs
# (which did fix the other 12 besu nodes). Raise the heap explicitly.
#
# Sizing: host 15.6 GiB; lodestar beacon ~1.8 GiB, buildoor ~0.35 GiB, sidecars ~1.3 GiB.
# 5 GiB heap + off-heap leaves comfortable headroom. There is no swap on these hosts
# (see BUG-832), so do NOT raise this to the point where a host OOM could kill the beacon.
# MaxHeapFreeRatio/MinHeapFreeRatio mirror the besu image defaults so we do not lose them.
besu_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_rcp_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_el_ports_http_rpc | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_rcp_hostname }}"
  BESU_OPTS: "-Xmx5g -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10"
