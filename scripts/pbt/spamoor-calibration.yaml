# Import into the Spamoor daemon only after launch/funding review. All entries stay stopped.
# Do not use `spamoor run`: that command executes entries regardless of daemon start flags.
# Startup/deployment/funding blocks are excluded from the measured workload.
- scenario: eoatx
  name: PBT-1 calibration / ETH transfers
  description: Bounded post-genesis calibration only; not a qualified 50% load profile.
  start: false
  config:
    seed: pbt-1-calibration-eoatx
    total_count: 1200
    throughput: 20
    max_pending: 40
    max_wallets: 32
    client_group: lighthouse-geth-1
    base_fee: 20
    tip_fee: 2
    rebroadcast: 1
    timeout: 20m
    refill_amount: 5000000000000000000
    refill_balance: 1000000000000000000
    refill_interval: 600
    amount: 1
    random_target: false
    gas_limit: 21000
