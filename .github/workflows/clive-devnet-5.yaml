name: Clive - Devnet 5
# Spec-test gate for ChainSafe/lodestar, sigp/lighthouse, status-im/nimbus-eth2,
# Consensys/teku, OffchainLabs/prysm, grandinetech/grandine at their
# glamsterdam-devnet-5 ref, against ethereum/consensus-spec-tests fixtures.
#
# Modelled on hive-devnet-0.yaml.no_run: matrix per client, results uploaded
# to the existing hive-results S3 bucket so hive-ui (planned /cl view) can
# ingest them via the same listing.jsonl + results/*.json schema hive uses.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily; same window hive-devnet-0 uses
  workflow_dispatch:
    inputs:
      cl_client:
        description: >-
          Comma-separated list of CL clients to test.
          One or more of: lodestar, lighthouse, nimbus, teku, prysm, grandine.
        required: false
        type: string
        default: '"lodestar","lighthouse","nimbus","teku","prysm","grandine"'
      cl_source_ref:
        description: 'Branch/tag/SHA on each client repo (default: glamsterdam-devnet-5).'
        required: false
        type: string
        default: 'glamsterdam-devnet-5'
      consensus_spec_tests_ref:
        description: >-
          ethereum/consensus-spec-tests release tag. Empty = per-client pin.
          Prysm cannot be overridden (WORKSPACE SHA-pinned); it will record
          its own pinned ref in clive-meta.
        required: false
        type: string
        default: 'v1.7.0-alpha.10'
      scope:
        description: >-
          Adapter-specific test scope. `smoke` = fast plumbing check
          (BLS-only on most clients). `full` = the full state-transition
          coverage that gates the inventory.
        required: false
        type: choice
        default: 'smoke'
        options:
          - smoke
          - full
      clive_version:
        description: >-
          Ref of the clive action to run (default: master on
          ethpandaops/clive once it lands; barnabasbusa/clive@master while
          still on the fork).
        required: false
        type: string
        default: 'master'

env:
  # Reuse the hive bucket + CDN. Same convention syncoor/hive use.
  S3_BUCKET: hive-results
  S3_PATH: spec-glamsterdam-devnet-5
  S3_PUBLIC_URL: 'https://hive.ethpandaops.io/spec-glamsterdam-devnet-5/'

jobs:
  clive:
    name: ${{ matrix.cl-client }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ${{ github.event_name }}-clive-glamsterdam-devnet-5-${{ matrix.cl-client }}
    strategy:
      fail-fast: false
      matrix:
        cl-client: >-
          ${{
            fromJSON(format('[{0}]', inputs.cl_client || '
              "lodestar",
              "lighthouse",
              "nimbus",
              "teku",
              "prysm",
              "grandine"
          '))}}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run clive against ${{ matrix.cl-client }}@${{ inputs.cl_source_ref || 'glamsterdam-devnet-5' }}
        uses: barnabasbusa/clive@master   # TODO: flip to ethpandaops/clive@<sha> once transferred
        with:
          cl_client: ${{ matrix.cl-client }}
          cl_source_ref: ${{ inputs.cl_source_ref || 'glamsterdam-devnet-5' }}
          consensus_spec_tests_ref: ${{ inputs.consensus_spec_tests_ref || 'v1.7.0-alpha.10' }}
          scope: ${{ inputs.scope || 'smoke' }}
          network: glamsterdam-devnet-5
          fail_on: 'sanity,operations,epoch_processing,transition,random,finality'

          # Schedules upload to S3; workflow_dispatch runs are smoke-only and stay ephemeral.
          s3_upload: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          s3_bucket: ${{ env.S3_BUCKET }}
          s3_path: ${{ env.S3_PATH }}
          s3_public_url: ${{ env.S3_PUBLIC_URL }}
          rclone_config: ${{ secrets.HIVE_RCLONE_CONFIG }}
          workflow_artifact_upload: 'true'
