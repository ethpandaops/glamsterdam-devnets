- scenario: calltx
  name: "3631 attack C: random-alphabet JUMPDEST ring (n=16384)"
  description: >-
    Zero-calldata full-block txs that walk the ring sequentially, persisting the ring index
    across transactions so consecutive blocks touch disjoint contracts (the LRU worst case).
    3,163 gas per 64 KiB cold code load = 20.7 bytes/gas. Point contract_address at the
    ring driver whose n matches how much of the corpus has actually been deployed.
  config:
    seed: jd3631-attack-c-stop_jumpdest_push1
    base_fee: 20
    tip_fee: 2
    max_wallets: 24
    max_pending: 48
    refill_amount: 5000000000000000000
    refill_balance: 1000000000000000000
    refill_interval: 600
    # Points at the LARGEST ring: 16,384 x 64 KiB = 1.07 GB is the working set that
    # defeats every client's code cache (BUG-897), and anything smaller is a weaker
    # attack. It is only correct once the corpus is complete, and a ring slot with no
    # code costs 3,000 gas while analysing nothing, so gate the start on
    #     python3 monitor_corpus.py --verify 16384
    # which exits non-zero until every slot exists. The n=4096 and n=8192 drivers are
    # deployed alongside if you want to attack earlier at a smaller working set.
    contract_address: "0xe8730e19b17d5312cf319f8af8a7f8eab5ba2f65"
    call_data: ""
    gas_limit: 16777216
    throughput: 16                # over-provisioned; see attack A
    amount: 0
    rebroadcast: 120
