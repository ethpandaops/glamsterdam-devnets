# Name: Random-alphabet JUMPDEST ring (stop_jumpdest_push1)
# Description: The spamoor-108 ring over a corpus of 64 KiB contracts filled with PR-3631 random bytes instead of 0x5b - cache-capacity misses stacked on predictor-hostile analysis
#
# BUG-897 cache-capacity misses stacked on predictor-hostile analysis.
# 20.7 bytes/gas, ~4.1 GB per 200M block.
# Tags: performance, max-gas, state-read, eip7954, eip8037
# Min_Version: v1.1.5
#
# The corpus is the long pole: 100.5M state gas per contract. Two cannot share a 200M
# block (200.9M of state gas), and EIP-8037 additionally requires tx.gas <=
# state_gas_available, so exactly ONE lands per block: ~27.3 h for 16,384 at 6s slots.
# Verified on geth Amsterdam: a block carried 1 deploy (100.5M state) alongside 11 attack
# transactions (184M execution) -- the dimensions are independent, so running the corpus
# and an attack together costs the attack nothing.
# Start the corpus spammer first and move the attack to a bigger ring driver as it grows.
# Needs prep 1/3 from A-direct-port.yaml (same blob).
#
# RESTART HAZARD: factorydeploytx computes each salt as start_salt + <tx index in this run>,
# so a restarted spammer re-deploys from start_salt and makes no progress at ~100M gas a
# block. To resume, regenerate with CORPUS_START=<frontier from monitor_corpus.py> and
# re-import, or edit start_salt/total_count on the existing spammer before restarting it.
- scenario: factorydeploytx
  name: "3631-C corpus: 16384 x 64 KiB random-alphabet contracts (stop_jumpdest_push1)"
  description: >-
    Each contract EXTCODECOPYs the shared blob and stamps its own ADDRESS at bytes 32..63,
    so all 16384 have distinct code hashes and no client can dedupe them.
    Verified: 130/130 unique hashes on geth Amsterdam.
  config:
    seed: jd3631-corpus-stop_jumpdest_push1
    base_fee: 20
    tip_fee: 2
    max_wallets: 6
    max_pending: 4
    refill_amount: 20000000000000000000
    refill_balance: 10000000000000000000
    refill_interval: 600
    total_count: 16384
    # One max-size deploy is 100,453,800 state gas, so TWO need 200.9M and cannot share a
    # 200M block -- and tx.gas must additionally fit the remaining state budget. The real
    # rate is 1 contract per block (~27.3 h for 16,384). Submitting 2/slot just keeps a
    # deploy queued so no block goes without one; max_pending caps the backlog.
    throughput: 2
    gas_limit: 120000000
    well_known_factory: true
    start_salt: 0
    init_code: "6201000060006000733b47073bd0313c8e775e215cb80d85b7c6990e613c7f5b5b5b5b5b5b5b5b5b5b5b5b00000000000000000000000000000000000000003017602052620100006000f3"
